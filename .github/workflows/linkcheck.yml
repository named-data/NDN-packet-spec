name: Check links
on:
  pull_request:
    paths-ignore:
      - 'CONTRIBUTING.md'
      - 'README.md'
  schedule:
    # weekly on Wednesday
    - cron: '0 12 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv tool install sphinx --with-requirements requirements.txt
      - name: Check external links
        run: make linkcheck SPHINXOPTS=--color
