name: Check links
on:
  pull_request:
    paths-ignore:
      - 'CONTRIBUTING.md'
      - 'README.md'
  schedule:
    # weekly on Wednesday
    - cron: '0 12 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          enable-cache: false
      - name: Install dependencies
        run: uv tool install sphinx --with-requirements requirements.txt
      - name: Check external links
        run: make linkcheck SPHINXOPTS=--color
