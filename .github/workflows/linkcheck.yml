name: Check links
on:
  pull_request:
    paths-ignore:
      - 'CONTRIBUTING.md'
      - 'README.md'
  schedule:
    # weekly on Wednesday
    - cron: '0 12 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv tool install sphinx --with-requirements requirements.txt
      - name: Check external links
        run: make linkcheck SPHINXOPTS=--color
