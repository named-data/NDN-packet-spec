name: Build
on:
  push:
    paths-ignore:
      - 'CONTRIBUTING.md'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'CONTRIBUTING.md'
      - 'README.md'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Enable deployment'
        type: boolean

permissions:
  contents: read

env:
  SPHINXOPTS: --fail-on-warning --show-traceback

jobs:
  html:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Extract version
        id: version
        run: |
          v=$(sed -nE "s/^version\s*=\s*['\"]([0-9]+(\.[0-9]+){0,3})['\"]/\1/p" conf.py)
          if [[ -z $v ]]; then
            echo "::error::Could not find a valid version in conf.py"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv tool install sphinx --with-requirements requirements.txt
      - name: Generate HTML
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make html
      - name: Upload HTML
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ndn-packet-spec-html
          path: _build/html
          if-no-files-found: error

  pdf:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2025-historic
      options: --user 1001:1001
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv tool install sphinx --with-requirements requirements.txt
      - name: Generate PDF
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make latexpdf
      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          path: _build/latex/ndn-packet-spec.pdf
          archive: false
          if-no-files-found: error

  deploy:
    if: (github.event_name == 'push' && github.ref_name == 'master') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: html
    uses: named-data/actions/.github/workflows/docs-deployment.yml@v1
    with:
      artifact-id: ${{ needs.html.outputs.artifact-id }}
      version: ${{ needs.html.outputs.version }}
    secrets: inherit
